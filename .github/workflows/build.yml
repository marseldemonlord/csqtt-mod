name: Build CSQTT Mod APK

on:
  push:
    branches: [ main, master, mod-adaptive-padding-and-routing ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Tools & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile Rust Core for Android (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          echo "Using NDK: $ANDROID_NDK_HOME"

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64

          cd rust-client

          # Compile arm64-v8a (Samsung Galaxy S24 Ultra)
          echo "Compiling arm64-v8a..."
          cargo ndk -t arm64-v8a -P 26 build --release
          cp target/aarch64-linux-android/release/client ../app/src/main/jniLibs/arm64-v8a/libclient.so

          # Compile armeabi-v7a (for split APK support)
          echo "Compiling armeabi-v7a..."
          cargo ndk -t armeabi-v7a -P 26 build --release
          cp target/armv7-linux-androideabi/release/client ../app/src/main/jniLibs/armeabi-v7a/libclient.so

          # Compile x86_64
          echo "Compiling x86_64..."
          cargo ndk -t x86_64 -P 26 build --release
          cp target/x86_64-linux-android/release/client ../app/src/main/jniLibs/x86_64/libclient.so

          cd ..

          ls -lh app/src/main/jniLibs/*/*.so

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias csqtt \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass csqtt123 \
            -keypass csqtt123 \
            -dname "CN=CSQTT, OU=CSQTT, O=CSQTT, L=Default, S=Default, C=US"

      - name: Build Android Release and Debug APKs
        run: |
          chmod +x gradlew

          echo "Building Release APKs..."
          ./gradlew assembleRelease --no-daemon -x test \
            -PKEYSTORE_FILE=release.keystore \
            -PKEYSTORE_PASSWORD=csqtt123 \
            -PKEY_ALIAS=csqtt \
            -PKEY_PASSWORD=csqtt123

          echo "Building Debug APKs..."
          ./gradlew assembleDebug --no-daemon -x test

      - name: Organize Output APKs
        run: |
          mkdir -p dist
          # Copy Release APKs (Optimized with ProGuard/R8 and signed)
          cp app/build/outputs/apk/release/app-universal-release.apk dist/CSQTT-universal-release.apk || true
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/CSQTT-arm64-v8a-release.apk || true
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/CSQTT-armeabi-v7a-release.apk || true
          cp app/build/outputs/apk/release/app-x86_64-release.apk dist/CSQTT-x86_64-release.apk || true

          # Copy Debug APKs (Unminified with debug symbols)
          cp app/build/outputs/apk/debug/app-universal-debug.apk dist/CSQTT-universal-debug.apk || true
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/CSQTT-arm64-v8a-debug.apk || true
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk dist/CSQTT-x86_64-debug.apk || true

          echo "Available APK artifacts:"
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CSQTT-Mod-All-APKs
          path: dist/*.apk
