name: Build CSQTT Mod APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile Rust Core for ARM64 (Galaxy S24 Ultra)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/26.1.10909125"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd rust-client
          cargo ndk -t arm64-v8a -P 26 build --release
          cp target/aarch64-linux-android/release/client ../app/src/main/jniLibs/arm64-v8a/libclient.so || \
          cp ../target/aarch64-linux-android/release/client ../app/src/main/jniLibs/arm64-v8a/libclient.so
          cd ..

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSQTT-Galaxy-S24-Ultra-Mod
          path: app/build/outputs/apk/debug/*.apk
